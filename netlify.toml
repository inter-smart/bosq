[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# Environment variables for all contexts
[context.production.environment]
  API_URL = "https://crm.intersmarthosting.in/bosq"

[context.deploy-preview.environment]
  API_URL = "https://crm.intersmarthosting.in/bosq"

[context.branch-deploy.environment]
  API_URL = "https://crm.intersmarthosting.in/bosq"

# Proxy all /api/frontend/* requests to the backend API
[[redirects]]
  from = "/api/frontend/*"
  to = "https://crm.intersmarthosting.in/bosq/api/frontend/:splat"
  status = 200
  force = true

[[plugins]]
  package = "@netlify/plugin-nextjs"